name: Secure RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:

      - name: Configure Core RDP Settings
        shell: powershell
        run: |
          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server" `
            -Name "fDenyTSConnections" `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "UserAuthentication" `
            -Value 1 `
            -Force

          Set-ItemProperty `
            -Path "HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp" `
            -Name "SecurityLayer" `
            -Value 1 `
            -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"

          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389

          Restart-Service -Name TermService -Force


      - name: Create RDP User
        shell: powershell
        run: |
          $username = "TOOLBOXLAP"
          $password = "admin123"

          $securePass = ConvertTo-SecureString `
            $password `
            -AsPlainText `
            -Force

          if (Get-LocalUser -Name $username -ErrorAction SilentlyContinue) {
              Set-LocalUser `
                -Name $username `
                -Password $securePass
          }
          else {
              New-LocalUser `
                -Name $username `
                -Password $securePass `
                -AccountNeverExpires `
                -PasswordNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member $username `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member $username `
            -ErrorAction SilentlyContinue

          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

          if (-not (Get-LocalUser -Name $username -ErrorAction SilentlyContinue)) {
              Write-Error "User creation failed"
              exit 1
          }


      - name: Install Tailscale
        shell: powershell
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest `
            -Uri $tsUrl `
            -OutFile $installerPath

          Start-Process `
            msiexec.exe `
            -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" `
            -Wait

          Remove-Item `
            $installerPath `
            -Force


      - name: Establish Tailscale Connection
        shell: powershell
        run: |
          $tailscale = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $tailscale)) {
              Write-Error "Tailscale executable not found."
              exit 1
          }

          & $tailscale up `
            --authkey="${{ secrets.TAILSCALE_AUTHKEY }}" `
            --hostname="github-rdp-$env:GITHUB_RUN_ID"

          $tsIP = $null
          $retries = 0

          while (-not $tsIP -and $retries -lt 15) {
              $tsIP = & $tailscale ip -4 |
                Select-Object -First 1

              if (-not $tsIP) {
                  Start-Sleep -Seconds 4
              }

              $retries++
          }

          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }

          $tsIP = $tsIP.Trim()

          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV


      - name: Verify RDP Accessibility
        shell: powershell
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed."
              exit 1
          }

          Write-Host "TCP connectivity successful!"


      - name: Display RDP Information
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "              RDP ACCESS"
          Write-Host "=========================================="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASSWORD"
          Write-Host "Port     : 3389"
          Write-Host "=========================================="
          Write-Host ""


      - name: Maintain Connection
        shell: powershell
        run: |
          Write-Host "RDP session is active."

          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Use Cancel workflow to terminate."
              Start-Sleep -Seconds 300
          }
